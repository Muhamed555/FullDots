# FullDots on Dokploy. See docs/DOKPLOY.md.
# Dokploy's Traefik serves HTTPS on your domain and forwards to the app on port
# 4310 over dokploy-network, so no host port is published. Set the variables in
# the Environment tab of the Dokploy service; Dokploy writes them to .env.
# The read-only page reader starts when COMPOSE_PROFILES=browser is set.
services:
  app:
    build:
      context: .
      target: app
    expose:
      - '4310'
    environment:
      OWNER_TOKEN: ${OWNER_TOKEN:?Set a 24+ character OWNER_TOKEN}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to https://your-domain}
      OWNER_ID: ${OWNER_ID:-opendots-owner}
      # Models. These define the built-in "Default (from .env)" provider;
      # more providers are added in Settings > Models.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      MODEL_PROVIDERS_ALLOW_LAN: ${MODEL_PROVIDERS_ALLOW_LAN:-}
      # Realtime voice (optional).
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_MODEL: ${VOICE_MODEL:-}
      VOICE_NAME: ${VOICE_NAME:-marin}
      # Web search: duckduckgo (no key) or disabled.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-duckduckgo}
      # Connectors and approvals. The connector key defaults to a file in the
      # data volume; set CONNECTOR_SECRET_KEY to supply your own.
      CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY:-}
      CONNECTORS_ALLOW_STDIO: ${CONNECTORS_ALLOW_STDIO:-}
      CONNECTOR_RESULT_MAX_CHARS: ${CONNECTOR_RESULT_MAX_CHARS:-}
      APPROVAL_TTL: ${APPROVAL_TTL:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      # Always-on work and teams (empty uses the built-in defaults).
      BACKGROUND_CONCURRENCY: ${BACKGROUND_CONCURRENCY:-}
      DOT_DAILY_TOKEN_WARN: ${DOT_DAILY_TOKEN_WARN:-}
      TEAM_MAX_DEPTH: ${TEAM_MAX_DEPTH:-}
      # Work limits (empty uses the built-in defaults).
      AGENT_TURN_TIMEOUT: ${AGENT_TURN_TIMEOUT:-}
      AGENT_TURN_GRACE: ${AGENT_TURN_GRACE:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-}
      COMPUTER_EXEC_MAX_TIMEOUT: ${COMPUTER_EXEC_MAX_TIMEOUT:-}
      COMPUTER_COMMAND_MAX_CHARS: ${COMPUTER_COMMAND_MAX_CHARS:-}
      COMPUTER_FILE_MAX_CHARS: ${COMPUTER_FILE_MAX_CHARS:-}
      COMPUTER_TYPE_MAX_CHARS: ${COMPUTER_TYPE_MAX_CHARS:-}
      COMPUTER_REQUEST_TIMEOUT: ${COMPUTER_REQUEST_TIMEOUT:-}
      COMPUTER_RESPONSE_MAX_MB: ${COMPUTER_RESPONSE_MAX_MB:-}
      # Connector secrets are ordinary variables that a connector names in
      # Settings. Pass each one through here, for example:
      # GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BROWSER_URL: http://browser:4311
      BROWSER_SECRET: ${BROWSER_SECRET:-}
    volumes:
      # SQLite database (DATABASE_PATH=/data/opendots.sqlite) and, unless
      # CONNECTOR_SECRET_KEY is set, the generated connector.key.
      - fulldots-data:/data
    labels:
      # The app sits on several networks; Traefik must use the shared one.
      - traefik.docker.network=dokploy-network
    networks:
      - dokploy-network
      - browser-link
      - app-egress
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4310/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  browser:
    profiles: [browser]
    build:
      context: .
      target: browser
    environment:
      BROWSER_SECRET: ${BROWSER_SECRET:-}
    networks:
      - browser-link
      - browser-egress
    init: true
    restart: unless-stopped
    shm_size: 256mb
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  dokploy-network:
    external: true
  browser-link:
    internal: true
  app-egress:
  browser-egress:
volumes:
  fulldots-data:
