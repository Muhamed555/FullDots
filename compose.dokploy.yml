# FullDots on Dokploy: deploy as a "Docker Compose" service from GitHub with this file.
# Step-by-step guide: docs/DEPLOY-DOKPLOY.md.
#
# Dokploy routes your domain to the `app` service on port 4310 (set it in the Domains tab) and
# terminates HTTPS. Nothing here publishes a host port. Set the variables in Dokploy's
# Environment tab; the ones marked required stop the deploy with a message when missing.
#
# Dot computers are optional: add COMPOSE_PROFILES=computers to the environment (plus the three
# COMPUTER_* secrets) to build and start the computer supervisor as well.
#
# Private search is optional too: COMPOSE_PROFILES=search with WEB_SEARCH_PROVIDER=searxng runs
# SearXNG next to the app. Use it when DuckDuckGo blocks your server. Both: search,computers.
services:
  app:
    build:
      context: .
      target: app
    expose:
      - '4310'
    environment:
      # Required: the password you type to unlock FullDots, 24+ random characters.
      OWNER_TOKEN: ${OWNER_TOKEN:?Set OWNER_TOKEN (24+ random characters) in the Environment tab}
      # Required: the exact public address, for example https://dots.example.com
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your https:// address in the Environment tab}
      OWNER_ID: ${OWNER_ID:-opendots-owner}
      # Models: the built-in "Default (from .env)" provider. Leave empty and add providers in
      # Settings > Models instead if you prefer.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # Realtime voice (optional; needs HTTPS, which Dokploy provides).
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_MODEL: ${VOICE_MODEL:-}
      VOICE_NAME: ${VOICE_NAME:-marin}
      # Web search: duckduckgo (no key), browser (the Dot's computer), searxng (the `searxng` service below) or disabled.
      # DuckDuckGo often blocks VPS addresses; then use browser or searxng with COMPOSE_PROFILES=search.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-duckduckgo}
      WEB_SEARCH_ENGINE: ${WEB_SEARCH_ENGINE:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # The connector key defaults to a file in the data volume. Set your own to keep it outside
      # the volume (then back it up separately).
      CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY:-}
      CONNECTORS_ALLOW_STDIO: ${CONNECTORS_ALLOW_STDIO:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      APPROVAL_TTL: ${APPROVAL_TTL:-}
      # Work limits and teams (empty uses the built-in defaults).
      AGENT_TURN_TIMEOUT: ${AGENT_TURN_TIMEOUT:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-}
      BACKGROUND_CONCURRENCY: ${BACKGROUND_CONCURRENCY:-}
      DELEGATION_TIMEOUT: ${DELEGATION_TIMEOUT:-}
      TEAM_MAX_DEPTH: ${TEAM_MAX_DEPTH:-}
      TEAM_RELAY_MAX: ${TEAM_RELAY_MAX:-}
      DOT_DAILY_TOKEN_WARN: ${DOT_DAILY_TOKEN_WARN:-}
      COMPUTER_REPLAY_FRAMES: ${COMPUTER_REPLAY_FRAMES:-}
      # Page reader (the `browser` service below): lets Dots read search results in full.
      BROWSER_URL: http://browser:4311
      BROWSER_SECRET: ${BROWSER_SECRET:?Set BROWSER_SECRET (24+ random characters) in the Environment tab}
      # Dot computers (optional): set COMPUTER_SUPERVISOR_URL=http://computer-supervisor:4300
      # together with COMPOSE_PROFILES=computers.
      COMPUTER_SUPERVISOR_URL: ${COMPUTER_SUPERVISOR_URL:-}
      COMPUTER_SUPERVISOR_TOKEN: ${COMPUTER_SUPERVISOR_TOKEN:-}
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
      COMPUTER_NAMESPACE: ${COMPUTER_NAMESPACE:-fulldots}
    volumes:
      # The SQLite database and, unless CONNECTOR_SECRET_KEY is set, connector.key, which
      # encrypts saved model keys and connector sign-ins. Back them up together.
      - fulldots-data:/data
    networks:
      - browser-link
      - search-link
      - app-egress
      - computer-control
      - computers
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4310/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  browser:
    build:
      context: .
      target: browser
    environment:
      BROWSER_SECRET: ${BROWSER_SECRET:?Set BROWSER_SECRET (24+ random characters) in the Environment tab}
    networks:
      - browser-link
      - browser-egress
    init: true
    restart: unless-stopped
    shm_size: 256mb
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --- Private web search (COMPOSE_PROFILES=search) -----------------------------------------
  # SearXNG asks several search engines for the app. Only the app reaches it; it has no port.
  searxng:
    profiles: [search]
    image: docker.io/searxng/searxng:2026.10.4-d48c4b555
    # A fresh secret key at every start: nothing outside this container signs with it.
    entrypoint:
      - /bin/sh
      - -c
      - export SEARXNG_SECRET="$$(head -c 32 /dev/urandom | base64 | tr -dc a-zA-Z0-9)"; exec /usr/local/searxng/entrypoint.sh
    environment:
      FORCE_OWNERSHIP: 'false'
    volumes:
      - ./deployment/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - search-link
      - search-egress
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --- Dot computers (COMPOSE_PROFILES=computers) -------------------------------------------
  # The image every Dot computer runs. Built only; its container exits at once.
  computer-image:
    profiles: [computers]
    image: opendots-computer:b6932d3
    build:
      context: https://github.com/CopilotKit/OpenBot.git#b6932d31a8d6e7896c15139dfc27a6c6911deb27
      dockerfile: agent-computer/Dockerfile
    command: ['true']
    restart: 'no'

  # Starts one container per Dot on request. It is the only service that mounts the Docker
  # socket, which gives it control of the server's Docker: see docs/DEPLOY-DOKPLOY.md.
  computer-supervisor:
    profiles: [computers]
    image: opendots-supervisor:b6932d3-dot-auth
    build:
      context: .
      dockerfile: deployment/computers/supervisor.Dockerfile
      additional_contexts:
        openbot: https://github.com/CopilotKit/OpenBot.git#b6932d31a8d6e7896c15139dfc27a6c6911deb27
    environment:
      PORT: '4300'
      SUPERVISOR_TOKEN: ${COMPUTER_SUPERVISOR_TOKEN:-}
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
      COMPUTER_NAMESPACE: ${COMPUTER_NAMESPACE:-fulldots}
      COMPUTER_IMAGE: opendots-computer:b6932d3
      COMPUTER_BROWSER_MODE: headless
      COMPUTER_NETWORK: ${COMPUTER_NAMESPACE:-fulldots}-computers
      COMPUTER_MEMORY_BYTES: ${COMPUTER_MEMORY_BYTES:-2147483648}
      COMPUTER_RUNTIME: ${COMPUTER_RUNTIME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - computer-control
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r = await fetch('http://localhost:4300/health'); const j = await r.json(); process.exit(r.ok && j.docker ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  # The app talks to the page reader, SearXNG and the supervisor on internal networks only.
  browser-link:
    internal: true
  search-link:
    internal: true
  computer-control:
    internal: true
  app-egress:
  browser-egress:
  search-egress:
  # The network the supervisor attaches Dot computers to; the app reaches them by name.
  computers:
    name: ${COMPUTER_NAMESPACE:-fulldots}-computers

volumes:
  fulldots-data:
