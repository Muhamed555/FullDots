# Settings for the private SearXNG that FullDots searches through (WEB_SEARCH_PROVIDER=searxng).
# Only the FullDots app can reach it, on an internal network. Everything not listed here keeps
# SearXNG's defaults: https://docs.searxng.org/admin/settings/index.html
use_default_settings: true

general:
  instance_name: FullDots search

server:
  # The secret key comes from SEARXNG_SECRET, which the compose file generates at every start.
  # No bot limiter: the only client is FullDots. It would otherwise answer with HTTP 429.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  # FullDots reads results from /search?format=json, which SearXNG refuses unless listed here.
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 10.0
