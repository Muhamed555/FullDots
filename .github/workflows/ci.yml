name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check-format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the built app
        run: npm run smoke -- start
      - name: Validate compose files
        env:
          OWNER_TOKEN: ci-only-token-0123456789abcdef
          COMPUTER_SUPERVISOR_TOKEN: ci-only-supervisor-token
          COMPUTER_TOKEN: ci-only-computer-token
        run: |
          docker compose -f compose.yml config -q
          docker compose -f compose.yml -f compose.computers.yml -f compose.computers-app.yml config -q

  cross-platform:
    name: Tests and dev startup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tests
        # Linux already runs the suite in the check job.
        if: matrix.os != 'ubuntu-latest'
        run: npm test
      - name: npm run dev starts the API, the web app and the proxy
        run: npm run smoke -- dev

  desktop:
    name: Desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          # The same package a release makes for Linux (see release-desktop.yml).
          - name: Linux
            os: ubuntu-latest
            make: -- --targets=deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - name: Build the web app, stage the server and make the installer
        working-directory: desktop
        run: npm run make ${{ matrix.make }}
      - name: Open the window and check it end to end
        # The checks drive the Windows window; macOS and Linux are built here and checked by hand.
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npm run test:e2e
      - name: Keep the installer to download from this run
        uses: actions/upload-artifact@v7
        with:
          name: FullDots-Desktop-${{ matrix.name }}
          # Unsigned test builds. Releases are built by release-desktop.yml.
          path: |
            desktop/out/make/**/*.exe
            desktop/out/make/**/*.dmg
            desktop/out/make/**/*.deb
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: No high or critical vulnerabilities beyond audit-allowlist.json
        run: npm run audit:ci

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks over the full history
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1
          git --no-banner --redact --verbose .

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: App image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Page reader image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: browser
          push: false
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
