version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # CopilotKit ships its own AG-UI and RxJS versions, so these must move together.
      agent-stack:
        patterns:
          - '@copilotkit/*'
          - '@ag-ui/*'
          - '@tanstack/ai*'
          - 'rxjs'
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns:
          - '@copilotkit/*'
          - '@ag-ui/*'
          - '@tanstack/ai*'
          - 'rxjs'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
